name: iwiqoVPN
options:
  bundleIdPrefix: com.iwiqo
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.iwiqo.vpn
    PRODUCT_NAME: iwiqoVPN
    INFOPLIST_KEY_LSUIElement: "YES"
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright (c) 2026 iwiqo. All rights reserved."
targets:
  iwiqoVPN:
    type: application
    platform: macOS
    sources:
      - path: Sources/iwiqoVPN
    resources:
      - path: Sources/iwiqoVPN/Assets.xcassets
    dependencies:
      - sdk: ServiceManagement.framework
    settings:
      base:
        INFOPLIST_FILE: Sources/iwiqoVPN/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/iwiqoVPN/iwiqoVPN.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        